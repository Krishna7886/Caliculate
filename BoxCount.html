<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bundle & Row Box Counter</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --danger: #ef4444;
      --bundle-bg: #f1f5f9;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 700px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .bundle-card {
      background: var(--bundle-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .bundle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .bundle-title {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }

    .row-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .row-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .row-label {
      font-weight: 600;
      min-width: 60px;
    }

    input[type="number"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 15px;
    }

    .btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 500;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-add-row {
      background: #e2e8f0;
      color: #334155;
    }

    .btn-add-row:hover {
      background: #cbd5e1;
    }

    .btn-add-bundle {
      background: var(--primary);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .btn-add-bundle:hover {
      background: #1d4ed8;
    }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      font-size: 16px;
      padding: 4px 8px;
    }

    .btn-delete:hover {
      background: #fee2e2;
    }

    .bundle-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 8px;
    }

    .bundle-sum {
      font-weight: 700;
      font-size: 16px;
      color: #0f172a;
    }

    .grand-total-card {
      background: #1e293b;
      color: white;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grand-total-label {
      font-size: 20px;
      font-weight: 600;
    }

    .grand-total-value {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Bundle & Row Box Counter</h2>

    <div id="bundleContainer">
      <!-- Bundles will render dynamically here -->
    </div>

    <button class="btn btn-add-bundle" onclick="addBundle()">+ Add New Bundle</button>

    <div class="grand-total-card">
      <span class="grand-total-label">Grand Total Boxes:</span>
      <span class="grand-total-value" id="grandTotal">0</span>
    </div>
  </div>

  <script>
    // State layout: array of bundles, each bundle contains an array of row counts
    let bundles = [
      [0] // Starts with Bundle 1 containing 1 Row
    ];

    function render() {
      const container = document.getElementById('bundleContainer');
      container.innerHTML = '';

      let grandTotal = 0;

      bundles.forEach((rows, bundleIdx) => {
        // Calculate subtotal for this bundle
        const bundleSum = rows.reduce((acc, curr) => acc + curr, 0);
        grandTotal += bundleSum;

        const bundleDiv = document.createElement('div');
        bundleDiv.className = 'bundle-card';

        let rowsHtml = rows.map((count, rowIdx) => `
          <div class="row-item">
            <span class="row-label">Row ${rowIdx + 1}:</span>
            <input 
              type="number" 
              min="0" 
              placeholder="Enter box count" 
              value="${count === 0 ? '' : count}" 
              oninput="updateRow(${bundleIdx}, ${rowIdx}, this.value)"
            />
            ${rows.length > 1 ? `<button class="btn btn-delete" onclick="deleteRow(${bundleIdx}, ${rowIdx})">✕</button>` : ''}
          </div>
        `).join('');

        bundleDiv.innerHTML = `
          <div class="bundle-header">
            <span class="bundle-title">Bundle ${bundleIdx + 1}</span>
            ${bundles.length > 1 ? `<button class="btn btn-delete" onclick="deleteBundle(${bundleIdx})">Delete Bundle</button>` : ''}
          </div>
          
          <div class="row-list">
            ${rowsHtml}
          </div>

          <div class="bundle-footer">
            <button class="btn btn-add-row" onclick="addRow(${bundleIdx})">+ Add Row</button>
            <span class="bundle-sum">Bundle ${bundleIdx + 1} Total: ${bundleSum}</span>
          </div>
        `;

        container.appendChild(bundleDiv);
      });

      document.getElementById('grandTotal').innerText = grandTotal;
    }

    function updateRow(bundleIdx, rowIdx, value) {
      bundles[bundleIdx][rowIdx] = parseInt(value) || 0;
      render();
    }

    function addRow(bundleIdx) {
      bundles[bundleIdx].push(0);
      render();
    }

    function deleteRow(bundleIdx, rowIdx) {
      bundles[bundleIdx].splice(rowIdx, 1);
      render();
    }

    function addBundle() {
      bundles.push([0]);
      render();
    }

    function deleteBundle(bundleIdx) {
      bundles.splice(bundleIdx, 1);
      render();
    }

    // Initial render
    render();
  </script>

</body>
</html>
